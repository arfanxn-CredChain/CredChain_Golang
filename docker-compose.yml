version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      - POSTGRES_DSN=postgres://root:rootpassword@postgres:5432/credchain?sslmode=disable
      - MONGO_URI=mongodb://root:rootpassword@mongo:27017
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
    env_file:
      - .env

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: credchain
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d credchain"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:6-jammy
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:
